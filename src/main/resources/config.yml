# PocketMobs 配置文件
# Configuration version - DO NOT MODIFY
config-version: 4
lang: zh
debug: false
logic:
  buy:
    enabled: false
  craft:
    enabled: true
  ball-behaviour:
    return-to-inventory:
      on-free-mob: false
      on-catch-mob: false
    restore-full-health:
      on-free-mob: false
    reduce-usages:
      miss-target: true
    # 满球被发射器(dropper)射出时，在发射器处直接释放存储的生物。
    # When a filled ball is dispensed from a dropper, spawn the stored mob there.
    dropper-spawns-mob: false
keep-entity-uuid: false
# 世界过滤设置：白名单和黑名单可以分别开关。
#
# 白名单开启后，只允许 whitelist.worlds 中的世界使用精灵球功能。
# 黑名单开启后，blacklist.worlds 中的世界禁止使用精灵球功能。
# 两者同时开启时，黑名单优先；两者都关闭时，不限制世界。
#
# 如果服务器安装了 PerfectSelfWorld，捕捉生物时会模拟一次玩家对目标生物的
# 伤害事件，用于检查玩家是否拥有该家园区域的伤害权限；此操作不会实际造成伤害。
# 没有伤害权限时禁止捕捉，未安装 PerfectSelfWorld 时会自动跳过此检查。
world-filter:
  whitelist:
    enabled: true
    worlds:
      - world
      - world_nether
      - world_the_end
  blacklist:
    enabled: false
    worlds: []
default:
  ball:
    effects:
      catch:
        particle:
          name: ENTITY_EFFECT
          amount: 50
          color: "#00FF00"
        sound:
          name: BLOCK_ANVIL_PLACE
          volume: 1
          pitch: 2
      free:
        particle:
          name: EXPLOSION
          amount: 1
        sound:
          name: ENTITY_CHICKEN_EGG
          volume: 1
          pitch: 2
      missed:
        particle:
          name: CRIT
          amount: 20
        sound:
          name: ENTITY_ARMOR_STAND_HIT
          volume: 1
          pitch: 2
      not_spawned:
        particle:
          name: SMOKE
          amount: 10
        sound:
          name: ENTITY_ARMOR_STAND_HIT
          volume: 1
          pitch: 2
