# PocketMobs 配置文件
# Configuration version - DO NOT MODIFY
config-version: 3
lang: zh
debug: false
logic:
  buy:
    enabled: false
  craft:
    enabled: true
  ball-behaviour:
    return-to-inventory:
      on-free-mob: false
      on-catch-mob: false
    restore-full-health:
      on-free-mob: false
    reduce-usages:
      miss-target: true
    # 满球被发射器(dropper)射出时，在发射器处直接释放存储的生物。
    # When a filled ball is dispensed from a dropper, spawn the stored mob there.
    dropper-spawns-mob: false
keep-entity-uuid: false
worlds:
  - world
  - world_nether
  - world_the_end
default:
  ball:
    effects:
      catch:
        particle:
          name: ENTITY_EFFECT
          amount: 50
          color: "#00FF00"
        sound:
          name: BLOCK_ANVIL_PLACE
          volume: 1
          pitch: 2
      free:
        particle:
          name: EXPLOSION
          amount: 1
        sound:
          name: ENTITY_CHICKEN_EGG
          volume: 1
          pitch: 2
      missed:
        particle:
          name: CRIT
          amount: 20
        sound:
          name: ENTITY_ARMOR_STAND_HIT
          volume: 1
          pitch: 2
      not_spawned:
        particle:
          name: SMOKE
          amount: 10
        sound:
          name: ENTITY_ARMOR_STAND_HIT
          volume: 1
          pitch: 2
